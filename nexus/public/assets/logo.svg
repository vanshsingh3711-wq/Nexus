<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c152ff" />
      <stop offset="100%" stop-color="#491cd6" />
    </linearGradient>
    
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca57ff" />
      <stop offset="45%" stop-color="#6562ff" />
      <stop offset="100%" stop-color="#31e5ff" />
    </linearGradient>
    
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9175ff" />
      <stop offset="100%" stop-color="#18a2ff" />
    </linearGradient>
    
    <linearGradient id="flareGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    
    <!-- Filters for Depth and Glow -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="8" stdDeviation="8" flood-color="#050510" flood-opacity="0.7" />
    </filter>
    
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

 

  
  <!-- Main 3D Base Shapes -->
  <g>
    <!-- Right Stem (Back Layer) -->
    <path d="M 310 120 L 370 120 L 370 340 L 310 260 Z" 
          fill="url(#rightGrad)" 
          stroke="url(#rightGrad)" 
          stroke-width="6" 
          stroke-linejoin="round" />
    
    <!-- Left Stem (Back Layer) -->
    <path d="M 130 380 L 130 160 L 190 100 L 190 320 Z" 
          fill="url(#leftGrad)" 
          stroke="url(#leftGrad)" 
          stroke-width="6" 
          stroke-linejoin="round" />
    
    <!-- Center Diagonal (Front Layer with Drop Shadow) -->
    <path d="M 130 160 L 190 100 L 370 340 L 310 400 Z" 
          fill="url(#diagGrad)" 
          stroke="url(#diagGrad)" 
          stroke-width="6" 
          stroke-linejoin="round" 
          filter="url(#glassShadow)" />
  </g>

  <!-- Sharp Bevels & Highlights (Creates the glassy aesthetic) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diagonal Main Bright Edge -->
    <path d="M 133 161 L 190 104 L 368 338" stroke="#ffffff" stroke-width="2.5" opacity="0.6" />
    
    <!-- Diagonal Lower Soft Edge -->
    <path d="M 132 165 L 308 396" stroke="#c4f5ff" stroke-width="1.5" opacity="0.3" />

    <!-- Left Stem Inner Crease Highlight -->
    <path d="M 188 106 L 188 316" stroke="#ffffff" stroke-width="1.5" opacity="0.25" />
    
    <!-- Left Stem Left Outer Bevel -->
    <path d="M 132 165 L 132 376" stroke="#ffffff" stroke-width="1" opacity="0.15" />
    
    <!-- Left Stem Bottom Edge Bevel -->
    <path d="M 133 378 L 188 322" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

    <!-- Right Stem Inner Left Bevel -->
    <path d="M 312 124 L 312 256" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    
    <!-- Right Stem Top Flat Bevel -->
    <path d="M 312 122 L 368 122" stroke="#ffffff" stroke-width="2" opacity="0.4" />

    <!-- Right Stem Right Outer Edge -->
    <path d="M 368 124 L 368 336" stroke="#ffffff" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Stylized Diagonal Surface Scratches / Lens Flares -->
  <g>
    <line x1="160" y1="280" x2="310" y2="130" stroke="url(#flareGrad)" stroke-width="1.5" opacity="0.4" />
    <line x1="210" y1="340" x2="380" y2="170" stroke="url(#flareGrad)" stroke-width="1" opacity="0.2" />
    <line x1="240" y1="380" x2="410" y2="210" stroke="url(#flareGrad)" stroke-width="2" opacity="0.1" />
  </g>
</svg>
